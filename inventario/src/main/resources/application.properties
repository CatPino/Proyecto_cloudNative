spring.application.name=inventario
# Conexion a MySQL (ajusta host, puerto, BD, usuario y password a tu entorno)
spring.datasource.url=jdbc:mysql://localhost:3306/inventarioProyecto?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
 
server.port=8082