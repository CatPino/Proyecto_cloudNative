spring.application.name=usuario

# Conexion a Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.etimaxesrtgrgtnalbmr
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones a Supabase
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto del microservicio
server.port=8083

# Microsoft Entra ID / Spring Cloud Azure
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=d788e613-d97d-4ea3-a9d9-61589d1a6c72
spring.cloud.azure.active-directory.profile.tenant-id=54b79561-1edb-49d8-9906-2cd26284e9b6
spring.cloud.azure.active-directory.app-id-uri=api://d788e613-d97d-4ea3-a9d9-61589d1a6c72

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


# Dejar que Spring confirme el éxito o rechazo automáticamente
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Si falla tras los reintentos, NO volver a encolarlo en la cola original (para que vaya a la DLX)
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Configuración de reintentos (Exponential Backoff)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-retries=3